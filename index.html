<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmyTalk — Live WebRTC Video & Text Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              },
              darkbg: '#07090E',
              darkcard: '#0F1523',
              darkborder: '#1E293B',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- React, ReactDOM, Babel, Socket.io, Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #07090E; color: #F1F5F9; }
      video { background-color: #000; object-fit: cover; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      // YOUR LIVE RENDER BACKEND URL
      const BACKEND_URL = "https://omytalk-backend.onrender.com";

      // STUN SERVERS FOR WEBRTC NAT TRAVERSAL
      const ICE_SERVERS = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      };

      const { useState, useEffect, useRef } = React;

      // Safe Lucide Icon Wrapper Component
      function Icon({ name, className = "w-4 h-4" }) {
        const spanRef = useRef(null);
        useEffect(() => {
          if (spanRef.current && window.lucide) {
            spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
            window.lucide.createIcons({ root: spanRef.current });
          }
        }, [name, className]);
        return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
      }

      function App() {
        const [viewMode, setViewMode] = useState('home'); // 'home' | 'matching' | 'video_chat' | 'text_chat'
        const [chatType, setChatType] = useState('video');
        const [onlineCount, setOnlineCount] = useState(1);
        const [isBackendConnected, setIsBackendConnected] = useState(false);
        const [matchStatus, setMatchStatus] = useState('idle'); // 'searching' | 'connected'
        const [currentRoomId, setCurrentRoomId] = useState(null);

        // Media Stream & Peer State
        const [localStream, setLocalStream] = useState(null);
        const [remoteStream, setRemoteStream] = useState(null);
        const [isMuted, setIsMuted] = useState(false);
        const [isVideoOff, setIsVideoOff] = useState(false);

        // Messaging
        const [messages, setMessages] = useState([]);
        const [inputMessage, setInputMessage] = useState('');

        // Socket & Peer Refs
        const socketRef = useRef(null);
        const pcRef = useRef(null);
        const localVideoRef = useRef(null);
        const remoteVideoRef = useRef(null);
        const pendingCandidates = useRef([]);

        useEffect(() => {
          const socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });
          socketRef.current = socket;

          socket.on('connect', () => {
            console.log('Connected to Render Backend Socket:', socket.id);
            setIsBackendConnected(true);
          });

          socket.on('disconnect', () => {
            setIsBackendConnected(false);
          });

          socket.on('online_count', ({ count }) => {
            setOnlineCount(count);
          });

          socket.on('waiting', () => {
            setMatchStatus('searching');
          });

          socket.on('matched', async ({ roomId, isInitiator }) => {
            console.log('MATCHED! Room ID:', roomId, 'Is Initiator:', isInitiator);
            setCurrentRoomId(roomId);
            setMatchStatus('connected');

            if (chatType === 'video') {
              setViewMode('video_chat');
              await initWebRTC(roomId, isInitiator);
            } else {
              setViewMode('text_chat');
            }
          });

          socket.on('signal', async ({ signalData }) => {
            if (!pcRef.current) return;

            try {
              if (signalData.type === 'offer') {
                await pcRef.current.setRemoteDescription(new RTCSessionDescription(signalData));
                
                // Process pending ICE candidates that arrived early
                while (pendingCandidates.current.length > 0) {
                  const candidate = pendingCandidates.current.shift();
                  await pcRef.current.addIceCandidate(candidate);
                }

                const answer = await pcRef.current.createAnswer();
                await pcRef.current.setLocalDescription(answer);
                socketRef.current.emit('signal', { roomId: currentRoomId, signalData: answer });

              } else if (signalData.type === 'answer') {
                await pcRef.current.setRemoteDescription(new RTCSessionDescription(signalData));

              } else if (signalData.candidate) {
                const candidate = new RTCIceCandidate(signalData.candidate);
                if (pcRef.current.remoteDescription && pcRef.current.remoteDescription.type) {
                  await pcRef.current.addIceCandidate(candidate);
                } else {
                  pendingCandidates.current.push(candidate);
                }
              }
            } catch (err) {
              console.error('WebRTC Signaling Exception:', err);
            }
          });

          socket.on('receive_message', (msg) => {
            setMessages(prev => [...prev, msg]);
          });

          socket.on('stranger_disconnected', () => {
            alert('Stranger disconnected. Searching for next person...');
            cleanupPeerConnection();
            startMatchmaking(chatType);
          });

          return () => {
            socket.disconnect();
          };
        }, [chatType, currentRoomId]);

        useEffect(() => {
          if (localVideoRef.current && localStream) {
            localVideoRef.current.srcObject = localStream;
          }
        }, [localStream, viewMode]);

        useEffect(() => {
          if (remoteVideoRef.current && remoteStream) {
            remoteVideoRef.current.srcObject = remoteStream;
          }
        }, [remoteStream, viewMode]);

        const initWebRTC = async (roomId, isInitiator) => {
          cleanupPeerConnection();

          const pc = new RTCPeerConnection(ICE_SERVERS);
          pcRef.current = pc;

          // Request Real Camera & Microphone
          let stream = localStream;
          if (!stream) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
              setLocalStream(stream);
            } catch (err) {
              alert('Camera / Microphone permission denied or not available.');
              return;
            }
          }

          // Add Local Audio & Video Tracks to Connection
          stream.getTracks().forEach(track => {
            pc.addTrack(track, stream);
          });

          // Handle Remote Stream Tracks Received from Stranger
          pc.ontrack = (event) => {
            console.log('Received remote media stream track from Stranger!');
            if (event.streams && event.streams[0]) {
              setRemoteStream(event.streams[0]);
            }
          };

          // Send Local ICE Candidates to Stranger via Signaling Backend
          pc.onicecandidate = (event) => {
            if (event.candidate && socketRef.current) {
              socketRef.current.emit('signal', {
                roomId,
                signalData: { candidate: event.candidate }
              });
            }
          };

          // If initiator, create Offer
          if (isInitiator) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socketRef.current.emit('signal', { roomId, signalData: offer });
          }
        };

        const cleanupPeerConnection = () => {
          if (pcRef.current) {
            pcRef.current.close();
            pcRef.current = null;
          }
          setRemoteStream(null);
          pendingCandidates.current = [];
        };

        const startMatchmaking = async (type) => {
          setChatType(type);
          setViewMode('matching');
          setMatchStatus('searching');
          setMessages([]);
          cleanupPeerConnection();

          // Get camera access early if video mode
          if (type === 'video' && !localStream) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
              setLocalStream(stream);
            } catch (e) {
              alert('Please grant camera and microphone access to continue.');
              setViewMode('home');
              return;
            }
          }

          if (socketRef.current && socketRef.current.connected) {
            socketRef.current.emit('join_queue', { mode: type, interests: [] });
          }
        };

        const nextStranger = () => {
          cleanupPeerConnection();
          if (socketRef.current) socketRef.current.emit('leave_match');
          startMatchmaking(chatType);
        };

        const stopChat = () => {
          cleanupPeerConnection();
          if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            setLocalStream(null);
          }
          if (socketRef.current) socketRef.current.emit('leave_match');
          setViewMode('home');
          setMatchStatus('idle');
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          if (!inputMessage.trim()) return;

          const msgObj = { text: inputMessage, sender: 'you', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
          setMessages(prev => [...prev, msgObj]);

          if (socketRef.current && currentRoomId) {
            socketRef.current.emit('send_message', { roomId: currentRoomId, message: inputMessage });
          }
          setInputMessage('');
        };

        const toggleMute = () => {
          if (localStream) {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
              audioTrack.enabled = !audioTrack.enabled;
              setIsMuted(!audioTrack.enabled);
            }
          }
        };

        const toggleVideo = () => {
          if (localStream) {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
              videoTrack.enabled = !videoTrack.enabled;
              setIsVideoOff(!videoTrack.enabled);
            }
          }
        };

        return (
          <div className="min-h-screen flex flex-col justify-between bg-darkbg text-slate-100">
            {/* Header */}
            <header className="border-b border-darkborder px-6 py-4 flex items-center justify-between bg-darkcard">
              <div className="flex items-center gap-3 cursor-pointer" onClick={stopChat}>
                <div className="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center font-black text-lg text-white">
                  O
                </div>
                <div>
                  <h1 className="font-extrabold text-lg tracking-tight">OmyTalk</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Real-Time WebRTC P2P Video</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <span className="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  {onlineCount} {onlineCount === 1 ? 'stranger online' : 'strangers online'}
                </span>

                <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold uppercase ${isBackendConnected ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>
                  {isBackendConnected ? 'Server Online' : 'Connecting Server...'}
                </span>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="flex-1 flex flex-col justify-center items-center p-4">
              
              {/* Homepage View */}
              {viewMode === 'home' && (
                <div className="max-w-2xl text-center py-12">
                  <h2 className="text-4xl sm:text-5xl font-black text-white tracking-tight">
                    Talk to someone <span className="text-brand-500">completely new.</span>
                  </h2>
                  <p className="mt-4 text-slate-400 text-sm sm:text-base">
                    Direct camera-to-camera P2P video and text chat with real strangers worldwide.
                  </p>

                  <div className="mt-8 flex justify-center gap-4">
                    <button onClick={() => startMatchmaking('video')} className="bg-brand-600 hover:bg-brand-500 text-white font-extrabold px-8 py-4 rounded-2xl flex items-center gap-2 text-base shadow-lg">
                      <Icon name="video" className="w-5 h-5" />
                      Start Video Chat
                    </button>
                    <button onClick={() => startMatchmaking('text')} className="bg-slate-900 border border-slate-800 text-slate-200 font-bold px-6 py-4 rounded-2xl flex items-center gap-2 text-base">
                      <Icon name="message-square" className="w-5 h-5" />
                      Start Text Chat
                    </button>
                  </div>
                </div>
              )}

              {/* Matchmaking Radar View */}
              {viewMode === 'matching' && (
                <div className="text-center py-16 flex flex-col items-center">
                  <div className="w-20 h-20 rounded-full bg-brand-600/20 flex items-center justify-center animate-pulse mb-6 border border-brand-500/40">
                    <Icon name="loader" className="w-10 h-10 text-brand-500 animate-spin" />
                  </div>
                  <h3 className="text-xl font-bold text-white">Searching for an available stranger...</h3>
                  <p className="text-xs text-slate-400 mt-2">Open another browser window or mobile phone to pair instantly!</p>
                  <button onClick={stopChat} className="mt-6 bg-slate-900 border border-slate-800 text-slate-400 px-5 py-2 rounded-xl text-xs font-semibold">
                    Cancel Search
                  </button>
                </div>
              )}

              {/* Real WebRTC Video Chat View */}
              {viewMode === 'video_chat' && (
                <div className="w-full max-w-5xl flex flex-col gap-4">
                  <div className="grid md:grid-cols-2 gap-4 h-[420px]">
                    {/* Stranger Video Pane */}
                    <div className="bg-darkcard border border-darkborder rounded-2xl overflow-hidden relative flex items-center justify-center">
                      <video ref={remoteVideoRef} autoPlay playsInline className="w-full h-full object-cover" />
                      {!remoteStream && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 text-slate-400 text-xs font-semibold gap-2">
                          <Icon name="loader-2" className="w-6 h-6 animate-spin text-brand-500" />
                          <span>Connecting WebRTC Video Stream...</span>
                        </div>
                      )}
                      <div className="absolute top-3 left-3 bg-black/60 px-3 py-1 rounded-lg text-xs font-bold text-slate-200 border border-white/10">
                        Stranger (WebRTC Live)
                      </div>
                    </div>

                    {/* Local User Video Pane */}
                    <div className="bg-darkcard border border-darkborder rounded-2xl overflow-hidden relative flex items-center justify-center">
                      <video ref={localVideoRef} autoPlay playsInline muted className={`w-full h-full object-cover transform -scale-x-100 ${isVideoOff ? 'hidden' : ''}`} />
                      {isVideoOff && (
                        <div className="text-xs text-slate-500 font-bold">Camera Turned Off</div>
                      )}
                      <div className="absolute top-3 left-3 bg-black/60 px-3 py-1 rounded-lg text-xs font-bold text-slate-200 border border-white/10">
                        You
                      </div>
                    </div>
                  </div>

                  {/* Controls Toolbar */}
                  <div className="bg-darkcard border border-darkborder p-4 rounded-2xl flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <button onClick={nextStranger} className="bg-brand-600 hover:bg-brand-500 text-white font-black px-6 py-3 rounded-xl text-xs uppercase tracking-wider">
                        NEXT STRANGER →
                      </button>
                      <button onClick={stopChat} className="bg-slate-900 border border-slate-800 text-slate-300 font-bold px-4 py-3 rounded-xl text-xs">
                        Leave Chat
                      </button>
                    </div>

                    <div className="flex items-center gap-2">
                      <button onClick={toggleMute} className={`p-3 rounded-xl border ${isMuted ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                        <Icon name={isMuted ? 'mic-off' : 'mic'} className="w-4 h-4" />
                      </button>
                      <button onClick={toggleVideo} className={`p-3 rounded-xl border ${isVideoOff ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                        <Icon name={isVideoOff ? 'video-off' : 'video'} className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Text Chat View */}
              {viewMode === 'text_chat' && (
                <div className="w-full max-w-2xl bg-darkcard border border-darkborder rounded-2xl flex flex-col h-[500px] p-4">
                  <div className="flex items-center justify-between pb-3 border-b border-darkborder mb-3">
                    <span className="font-extrabold text-sm text-white">Connected to Stranger</span>
                    <button onClick={nextStranger} className="bg-brand-600 text-white text-xs font-black px-4 py-2 rounded-xl">
                      NEXT STRANGER
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-3 p-2 bg-slate-950/40 rounded-xl mb-3">
                    {messages.map((m, idx) => (
                      <div key={idx} className={`flex flex-col ${m.sender === 'you' ? 'items-end' : 'items-start'}`}>
                        <div className={`px-4 py-2 rounded-2xl text-xs max-w-xs ${m.sender === 'you' ? 'bg-brand-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`}>
                          {m.text}
                        </div>
                      </div>
                    ))}
                  </div>

                  <form onSubmit={handleSendMessage} className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Type a message..."
                      value={inputMessage}
                      onChange={(e) => setInputMessage(e.target.value)}
                      className="flex-1 bg-darkbg border border-darkborder rounded-xl px-4 py-3 text-xs text-white focus:outline-none"
                    />
                    <button type="submit" className="bg-brand-600 text-white px-4 py-3 rounded-xl text-xs font-bold">
                      Send
                    </button>
                  </form>
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
